[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meu-financeiro-telegram"
version = "1.0.0"
description = "Bot financeiro de MEI operado pelo Telegram"
requires-python = ">=3.11"
dependencies = [
  "reportlab==4.2.5",
  "XlsxWriter==3.2.0",
  "Pillow==10.4.0",
  "pytesseract==0.3.13",
]

[project.scripts]
mei-finance-bot = "mei_finance_bot.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
